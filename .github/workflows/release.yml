# Builds and attaches release assets for a published GitHub Release.
#
# Process:
#   1. Bump "version" in module.json's source is NOT needed - version comes
#      from the release tag itself (see "Extract Version From Tag" below).
#   2. On GitHub, go to Releases -> Draft a new release.
#   3. Create a new tag matching the version, e.g. "v1.1.0" (the leading "v"
#      is stripped automatically).
#   4. Publish the release. This workflow then runs automatically.
#   5. Watch the Actions tab - when it finishes, the release will have
#      "module.json" and "module.zip" attached as downloadable assets.
#   6. Install/update via the manifest URL shown on the release, or hand
#      users the evergreen URL:
#      https://github.com/<user>/<repo>/releases/latest/download/module.json
#   7. Non-prerelease publishes also POST the new version to Foundry's
#      Package Release API (https://foundryvtt.com/article/package-release-api/),
#      so the module's foundryvtt.com listing updates itself - no manual
#      admin-page step needed for routine releases.
#   8. Exception: the very first release of a brand-new package still needs
#      one manual submission at https://foundryvtt.com/packages/submit
#      (using that release's specific manifest URL, not /latest) before the
#      package exists on Foundry's side for the API to update.
#
# This workflow only runs on a *published* release, not on every push - it
# will not fire for ordinary commits, branches, or draft releases.
#
# Requires one repo secret:
#   - FOUNDRY_API_KEY: this module's "Package Release Token", found on its
#     foundryvtt.com package admin page just above "Save Package". Without
#     it, only the "Notify Foundry Package Listing" step fails - the GitHub
#     release itself still gets built and published correctly.
#
# Troubleshooting:
#   - module.json must be valid JSON (the repo's committed copy intentionally
#     contains literal #{VERSION}#/#{URL}#/#{MANIFEST}#/#{DOWNLOAD}# tokens -
#     those are only substituted with real values by this workflow, in a
#     checked-out copy, never committed back to the repo).
#   - If a file/folder referenced in "Create Module Archive" below doesn't
#     exist in the repo, `zip` will warn but should not fail the build; add
#     new top-level asset folders to that list as they're introduced.
#   - A failed "Notify Foundry Package Listing" step prints the API's
#     response body (via curl --fail-with-body) - check it for the actual
#     validation error (bad token, duplicate version, rate limit, etc.).

name: Release Module

env:
  project_url: "https://github.com/${{ github.repository }}"
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"
  release_manifest_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json"
  release_download_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"
  release_notes_url: "https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version From Tag
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Substitute Manifest Tokens
        uses: cschleiden/replace-tokens@v1
        with:
          files: "module.json"
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_download_url }}

      - name: Validate Manifest JSON
        run: cat module.json | python3 -m json.tool > /dev/null

      - name: Create Module Archive
        run: |
          zip                              \
            --recurse-paths                \
            ./module.zip                   \
            module.json                    \
            README.md                      \
            templates                      \
            scripts                        \
            styles                         \
            assets                         \
            languages

      - name: Attach Release Assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      - name: Notify Foundry Package Listing
        if: github.event.release.prerelease == false
        env:
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
        run: |
          BODY=$(jq -c \
            --arg version "${{ steps.get_version.outputs.version-without-v }}" \
            --arg manifest "${{ env.release_manifest_url }}" \
            --arg notes "${{ env.release_notes_url }}" \
            '{
              id: .id,
              release: {
                version: $version,
                manifest: $manifest,
                notes: $notes,
                compatibility: .compatibility
              }
            }' module.json)
          curl --fail-with-body -sS -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FOUNDRY_API_KEY}" \
            -d "$BODY"
